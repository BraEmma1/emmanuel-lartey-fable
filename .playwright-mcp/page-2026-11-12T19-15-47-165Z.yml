        - generic [ref=f1e34]:
          - paragraph [ref=f1e35]: "My work starts with the business, not the tool. Before anything is bought or built, I look at how the organization actually operates: where its records live, where time is lost, and what people need from a system on an ordinary working day."
          - paragraph [ref=f1e36]: From there I evaluate the options, implement what fits, and stay responsible for it afterwards. That means administering users, supporting staff, fixing what breaks and improving what can be better. Technology has earned its place when the people relying on it no longer have to think about it.
